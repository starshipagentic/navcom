[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navcom"
version = "0.10.0"
description = "Super-fast search over past AI coding sessions: Claude Code, Codex, Gemini CLI, pi, omo, opencode, goose"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["claude-code", "codex", "gemini-cli", "opencode", "goose", "pi", "llm", "search", "fts5", "transcripts"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/starshipagentic/navcom"
Repository = "https://github.com/starshipagentic/navcom"

[project.scripts]
navcom = "navcom:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["navcom.py", "navcom_web.py", "navcom_web.html", "navcom_intelligence.py", "navcom_atlas.py", "navcom_discovery.py", "navcom_atlas_cli.py", "navcom_research.py", "navcom_atlas.js", "navcom_atlas.css"]

[tool.hatch.build.targets.sdist]
include = ["navcom.py", "navcom_web.py", "navcom_web.html", "navcom_intelligence.py", "navcom_atlas.py", "navcom_discovery.py", "navcom_atlas_cli.py", "navcom_research.py", "navcom_atlas.js", "navcom_atlas.css", "README.md", "pyproject.toml", "features", "tests", "skills", "docs"]
